[project]
name = "multiple-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql == 0.2.0",
    "fastapi == 0.115.12",
    "fastapi-users == 14.0.0",
    "fastapi-users-db-sqlalchemy == 6.0.1",
    "httptools == 0.6.4",
    "httpx-oauth == 0.16.1",
    "mysqlclient == 2.2.7",
    "openai>=1.79.0",
    "pydantic == 2.11.4",
    "pydantic-settings == 2.9.1",
    "pymongo == 4.13.0",
    "redis[hiredis] == 5.3.0",
    "sqlalchemy[asyncio] == 2.0.41",
    "ujson == 5.10.0",
    "uvicorn[standard] == 0.34.2",
    "yarl == 1.20.0",
]
[project.optional-dependencies]
dev = [
    "pytest == 8.3.5",
    "ruff == 0.5.7",
    "mypy == 1.15.0",
    "pre-commit == 3.8.0",
    "black == 24.10.0",
    "pytest-cov == 5.0.0",
    "anyio == 4.9.0",
    "pytest-env == 1.1.5",
    "fakeredis == 2.29.0",
    "httpx == 0.27.2"
]


[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["multiple_agent",]

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true
